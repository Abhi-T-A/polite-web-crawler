version: '3.8'

services:
  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polite_scraper
    volumes:
      - ./app/output:/app/app/output
      - ./logs:/app/logs
    environment:
      - APP_NAME=Polite Scraper (Docker)
      - BASE_URL=https://books.toscrape.com
      - USER_AGENT=PoliteScraper/1.0 (+https://github.com/abhi)
      - REQUEST_TIMEOUT=30
      - REQUEST_DELAY=2
      - OUTPUT_JSON=app/output/data.json
      - OUTPUT_CSV=app/output/data.csv
      - DATABASE_PATH=app/output/scraper.db
      - LOG_LEVEL=INFO
    command: ["--limit", "5", "--json", "--csv", "--sqlite"]
